# Local QA environment only — not shipped in the plugin ZIP.
# Usage: docker compose -f tests/docker/docker-compose.yml up -d

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: evpx_root
      MYSQL_DATABASE: evpx_wp
      MYSQL_USER: evpx
      MYSQL_PASSWORD: evpx_pass
    volumes:
      - evpx_db_data:/var/lib/mysql

  wordpress:
    image: wordpress:php8.2-apache
    depends_on:
      - db
    ports:
      - '8080:80'
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: evpx_wp
      WORDPRESS_DB_USER: evpx
      WORDPRESS_DB_PASSWORD: evpx_pass
      WORDPRESS_DEBUG: 1
    volumes:
      - evpx_wp_data:/var/www/html
      - ../../:/var/www/html/wp-content/plugins/ev-charging-experience

volumes:
  evpx_db_data:
  evpx_wp_data:
